<svg width="2080" height="1240" viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="etcdstz-title etcdstz-desc" id="etcd-storage-layers-root" style="color-scheme: light dark"><style>svg{color-scheme:light dark}</style>
<title id="etcdstz-title">etcd 存储层次：MVCC、bbolt、WAL 与快照</title>
<desc id="etcdstz-desc">写请求先记录到 WAL，再提案到 MVCC 并提交到 bbolt；读请求直接查询 MVCC；MVCC 定期生成快照，快照用于压缩 WAL；恢复时重放 WAL 日志并加载快照，把状态恢复到 MVCC。</desc>
