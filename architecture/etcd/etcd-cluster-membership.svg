<title id="etcdclz-title">etcd 集群形成与成员管理</title>
<desc id="etcdclz-desc">集群通过静态配置、发现服务或 DNS 发现引导；运行时 leader 把日志复制到 follower 与 learner；AddMember 可新增 learner，PromoteMember 将其提升为 follower，RemoveMember 移除成员，UpdateMember 更新成员信息。</desc>
