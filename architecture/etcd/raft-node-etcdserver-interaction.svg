<?xml version="1.0" encoding="UTF-8"?>
<svg width="2320" height="1120" viewBox="0 0 1160 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="raftnoz-title raftnoz-desc" id="raft-node-etcdserver-interaction-root" style="color-scheme: light dark"><style>svg{color-scheme:light dark}</style>
<title id="raftnoz-title">raftNode 与 EtcdServer 的交互</title>
<desc id="raftnoz-desc">EtcdServer 向 raft.Node 提交 Propose 与 ReadIndex，raft.Node 以 Ready 回传；条目、读状态与快照分别送入 applyc、readStateC、msgSnapC 通道，apply() 从 applyc 取条目应用；rafthttp.Transport 负责与对等节点收发 Raft 消息并投递给 raft.Node。</desc>
