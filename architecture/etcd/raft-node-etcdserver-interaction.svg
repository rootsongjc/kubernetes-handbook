      #raft-node-etcdserver-interaction-root { font-family: var(--font-sans); color: var(--color-ink); }
      #raft-node-etcdserver-interaction-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#raft-node-etcdserver-interaction-root .diagram-container { overflow-x: visible; }
}</style>
