<title id="etcdsyz-title">etcd 系统架构：客户端、接口层与服务器核心</title>
<desc id="etcdsyz-desc">应用与 etcdctl 经 clientv3 库发起 gRPC 调用；请求先过 AuthStore 再到 EtcdServer，由其驱动 MVCC 存储、租约管理与 Raft 共识，Raft 写 WAL，MVCC / 租约 / WAL 最终落到 bbolt 后端。</desc>
