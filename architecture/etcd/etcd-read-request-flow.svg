      #etcd-read-request-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #etcd-read-request-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#etcd-read-request-flow-root .diagram-container { overflow-x: visible; }
}</style>
