<title id="etcdrez-title">etcd 读请求处理：可序列化读与线性化读</title>
<desc id="etcdrez-desc">客户端经 clientv3 发出 gRPC 读请求；可序列化读直接做权限检查后读本地 MVCC；线性化读先向 Raft 发 ReadIndex 确认不落后于 leader，再执行同样的权限检查与 Range。</desc>
