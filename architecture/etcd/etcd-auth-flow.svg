<title id="etcdauz-title">etcd 认证与授权流程</title>
<desc id="etcdauz-desc">客户端请求先校验令牌，由 AuthStore 借助 TokenProvider 验证令牌、在用户存储中确认用户，再检查权限：按角色存储获取角色后决定允许或拒绝。</desc>
