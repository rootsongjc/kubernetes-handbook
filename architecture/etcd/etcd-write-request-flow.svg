<title id="etcdwrz-title">etcd 写请求处理：始终经过 Raft 共识</title>
<desc id="etcdwrz-desc">写请求由 EtcdServer 封装为 raftRequest 提交给 Raft 节点；Raft 记录 WAL 并在多数节点达成共识后返回已提交条目，EtcdServer 再做权限检查并把变更应用到 MVCC / bbolt，最后返回 gRPC 响应。</desc>
