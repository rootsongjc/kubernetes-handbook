      #etcd-write-request-flow-root { --color-paper:#ffffff; --color-ink:#1d1d1f; --color-muted:#6b7280; --font-sans:'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; --font-serif:'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #etcd-write-request-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #etcd-write-request-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#etcd-write-request-flow-root .diagram-container { overflow-x: visible; }
}</style>
