<title id="labelsz-title">标签与选择器：选中匹配的 Pod</title>
<desc id="labelsz-desc">标签是附加在对象上的键值对；选择器 app=nginx,tier=frontend 选中标签匹配的 Pod 1、Pod 2，不选中标签不匹配的 Pod 3。</desc>
