<title id="borgarz-title">Borg 架构：用户接口、BorgMaster 与 Borglet</title>
<desc id="borgarz-desc">配置文件、命令行工具、网页浏览器与 borgcfg 通过 BorgMaster 管理一个 Cell；调度器向 BorgMaster 提交调度决策，BorgMaster 把任务下发到各节点上的 Borglet。</desc>
