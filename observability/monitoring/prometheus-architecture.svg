<title id="prometz-title">Prometheus 架构与数据流</title>
<desc id="prometz-desc">各种导出器、推送网关与客户端库暴露指标，Prometheus Server 抓取后写入时序数据库，并通过 PromQL 查询引擎服务于 Alertmanager、Grafana 与 HPA。</desc>
