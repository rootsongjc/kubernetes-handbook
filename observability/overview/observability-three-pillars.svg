<title id="observz-title">可观测性三支柱：Metrics、Logs、Traces</title>
<desc id="observz-desc">可观测性由指标、日志、链路追踪三大支柱构成；指标覆盖系统性能、资源使用与业务指标，日志分为应用、系统、审计三类，链路追踪用于请求链路跟踪、性能瓶颈分析与错误定位。</desc>
