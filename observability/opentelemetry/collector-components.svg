<title id="collecz-title">Collector 组件结构：Receiver → Processor → Exporter</title>
<desc id="collecz-desc">OTel Collector 内部由 Receiver 接收 OTLP、Jaeger、Prometheus 等数据，Processor 完成批处理、过滤与属性加工，Exporter 再导出到 OTLP、Prometheus、Kafka、Logging 等目标。</desc>
