<title id="collecz-title">Kubernetes 集群中的 OTel Collector 部署</title>
<desc id="collecz-desc">应用 Pod 内的 OTel SDK 或自动探针把数据发给以 Sidecar 或 DaemonSet 运行的 Collector Agent，Agent 转发到以 Deployment + Service 运行的 Collector Gateway，再统一导出到外部可观测性后端。</desc>
