<title id="otelarz-title">OpenTelemetry 架构总览：从应用代码到后端系统</title>
<desc id="otelarz-desc">应用代码经 OTel SDK 或自动探针产出观测数据，先到 Collector Agent，再经 OTLP 汇聚到 Collector Gateway，由 Exporter 写入可观测性后端，最终呈现在 Dashboards、告警与 Tracing UI。</desc>
