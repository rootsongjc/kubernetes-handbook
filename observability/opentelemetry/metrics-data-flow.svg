<title id="metricz-title">Metrics 数据流：从测量值到遥测后端</title>
<desc id="metricz-desc">应用产生的 Measurement 由 Instrument 记录进内存聚合状态，MetricReader 周期读取后交给 MetricExporter，最终写入遥测后端。</desc>
