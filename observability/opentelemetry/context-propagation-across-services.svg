      #context-propagation-across-services-root { font-family: var(--font-sans); color: var(--color-ink); }
      #context-propagation-across-services-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#context-propagation-across-services-root .diagram-container { overflow-x: visible; }
}</style>
