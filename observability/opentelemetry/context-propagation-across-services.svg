<svg width="2080" height="1320" viewBox="0 0 1040 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="contexz-title contexz-desc" id="context-propagation-across-services-root" style="color-scheme: light dark"><style>svg{color-scheme:light dark}</style>
<title id="contexz-title">上下文与跨服务传播：Service A → Propagators → 传输载体 → Service B</title>
<desc id="contexz-desc">Service A 的 Context 派生 Span 与 Baggage，由 Propagators 选择 W3C TraceContext、W3C Baggage 或 B3 格式注入 HTTP Headers、gRPC Metadata 或环境变量；Service B 从中提取后还原出 Span、Baggage 与 Context。</desc>
