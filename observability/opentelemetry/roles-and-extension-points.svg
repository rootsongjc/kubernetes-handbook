<title id="rolesaz-title">OpenTelemetry 的角色分工与扩展点</title>
<desc id="rolesaz-desc">库作者与埋点作者只依赖 API，埋点作者还向 Contrib 贡献；应用所有者配置 SDK、Processors 并选择 Exporters；插件作者扩展 SDK 接口并实现 Exporters；Semantic Conventions 为各角色共同遵循的标签规范。</desc>
