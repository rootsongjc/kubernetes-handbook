<title id="opentez-title">OpenTelemetry 架构：应用、Collector 与后端</title>
<desc id="opentez-desc">应用通过 OpenTelemetry API 与 SDK（或自动插桩）产生遥测数据，发送到 Collector；Collector 内部由接收器、处理器、导出器组成流水线，最终导出到 Jaeger、Prometheus、Elasticsearch 等后端。</desc>
