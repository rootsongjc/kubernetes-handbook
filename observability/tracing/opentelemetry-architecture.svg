      #opentelemetry-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #opentelemetry-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#opentelemetry-architecture-root .diagram-container { overflow-x: visible; }
}</style>
