      #tracing-vs-traditional-monitoring-root { font-family: var(--font-sans); color: var(--color-ink); }
      #tracing-vs-traditional-monitoring-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#tracing-vs-traditional-monitoring-root .diagram-container { overflow-x: visible; }
}</style>
