<text x="550" y="476" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">链路追踪把同一请求在各服务中的片段串成一条链，指标和日志才有了可关联的上下文。</text>
