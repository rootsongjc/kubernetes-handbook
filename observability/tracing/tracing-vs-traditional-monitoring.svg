<title id="tracinz-title">链路追踪与传统监控对比</title>
<desc id="tracinz-desc">传统监控只看指标和分散的日志，无法把它们关联到同一个请求；链路追踪提供完整请求链路、端到端延迟分析和跨服务关联，从而快速定位问题。</desc>
