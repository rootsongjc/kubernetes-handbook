<title id="jaegerz-title">Jaeger 架构总览：从应用到存储与查询</title>
<desc id="jaegerz-desc">应用通过 Jaeger Client 产生 Span，经 Agent 转发到 Collector 写入 Cassandra、Elasticsearch 或内存；Jaeger Query 从存储读取数据，供 Jaeger UI 展示。</desc>
