<title id="alertmz-title">Alertmanager 架构与处理流程</title>
<desc id="alertmz-desc">Prometheus 推送告警到 Alertmanager 的接收器，依次经过分组器、抑制器、静默器与路由器，最终分发到邮件、Slack、Webhook、PagerDuty 等通知渠道。</desc>
