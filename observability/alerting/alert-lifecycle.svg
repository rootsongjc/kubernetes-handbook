<title id="alertlz-title">告警生命周期：从监控到闭环</title>
<desc id="alertlz-desc">监控系统经阈值检查生成告警，依次完成分组、路由、通知、确认与问题解决后回到监控；告警生成阶段可被静默处理或抑制规则拦截。</desc>
