<title id="networz-title">NetworkPolicy 流量控制示意</title>
<desc id="networz-desc">default 命名空间中，NetworkPolicy 以 podSelector role=db 选中 database Pod：允许来自 app=frontend 的 Pod 与 other 命名空间 project=myproject 的 Pod 入站，拒绝 backend Pod，并允许出站到 10.0.0.0/24 的 5978 端口。</desc>
