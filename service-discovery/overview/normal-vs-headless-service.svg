<title id="normalz-title">普通 Service 与 Headless Service 对比</title>
<desc id="normalz-desc">普通 Service 提供 ClusterIP 10.96.0.10，客户端流量经它转发到后端 Pod；Headless Service 的 clusterIP 为 None，DNS 查询直接返回全部 Pod IP，客户端自行直连各个 Pod。</desc>
