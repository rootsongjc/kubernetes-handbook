<title id="ingresz-title">Ingress 流量路由示意</title>
<desc id="ingresz-desc">外部客户端的 HTTP(S) 请求到达 Ingress Controller（如 nginx-ingress）；控制器实现 Ingress 资源中 host 为 foo.bar.com 的规则，把 /foo 路由到 service1、/bar 路由到 service2，再由两个 Service 分发到各自的 Pod。</desc>
