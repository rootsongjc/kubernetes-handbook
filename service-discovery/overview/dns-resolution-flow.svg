<title id="dnsresz-title">Kubernetes DNS 解析流程</title>
<desc id="dnsresz-desc">Pod 向集群 DNS 服务 CoreDNS 发起查询；CoreDNS 根据名称返回 Service 的 A 记录或 SRV 记录，或返回 Pod 的 A 记录。</desc>
