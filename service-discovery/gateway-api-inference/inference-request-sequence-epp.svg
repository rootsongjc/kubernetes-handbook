<title id="inferez-title">推理请求处理时序（二）：EPP 内部的饱和检测与调度</title>
<desc id="inferez-desc">StreamingServer 把请求交给 Director；Director 从 Datastore 取 InferenceObjective 优先级与候选 Pod 指标并检查饱和度：系统饱和且优先级小于 0 时返回 429，否则由 Scheduler 执行 Filter → Score → Pick 选出 Pod，并把目标端点回给 Envoy。</desc>
