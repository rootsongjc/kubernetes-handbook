<?xml version="1.0" encoding="UTF-8"?>
<svg width="2160" height="1638" viewBox="0 0 1080 819" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inferez-title inferez-desc" id="inference-request-sequence-gateway-root" style="color-scheme: light dark"><style>svg{color-scheme:light dark}</style>
<title id="inferez-title">推理请求处理时序（一）：网关、BBR 与 EPP</title>
<desc id="inferez-desc">客户端发出 OpenAI 格式请求；Envoy 经 ext-proc 让 BBR 从请求体提取模型名并注入头部，按头部匹配 HTTPRoute 到 InferencePool；再经 ext-proc 让 EPP 选择目标端点，最后把请求转发到选定 Pod 并将推理响应返回客户端。</desc>
