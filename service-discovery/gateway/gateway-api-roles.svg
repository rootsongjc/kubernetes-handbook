<title id="gatewaz-title">Gateway API 的角色划分</title>
<desc id="gatewaz-desc">集群运维人员管理 Gateway（域名、TLS 证书、默认策略）；store 与 site 两个命名空间的开发者各自定义 HTTPRoute，把 /store/* 与 /site/* 路由到自己命名空间内的 Service。</desc>
