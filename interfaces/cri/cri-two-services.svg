<svg width="2000" height="1320" viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="critwoz-title critwoz-desc" id="cri-two-services-root" style="color-scheme: light dark"><style>svg{color-scheme:light dark}</style>
<title id="critwoz-title">CRI 的两大 gRPC 服务及其操作</title>
<desc id="critwoz-desc">CRI 定义 RuntimeService（Pod 沙箱、容器、执行、可观测性、配置五组操作）与 ImageService（镜像操作）两个 gRPC 服务；容器运行于 Pod 沙箱之中。</desc>
