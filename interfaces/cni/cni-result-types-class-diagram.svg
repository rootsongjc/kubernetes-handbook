<title id="cniresz-title">CNI 结果类型关系</title>
<desc id="cniresz-desc">Result 接口定义 Version、GetAsVersion、Print、PrintTo 方法，由 current.Result 实现并携带 Interfaces、IPs、Routes、DNS；NetConfList 包含多个 PluginConf，PluginConf 通过 PrevResult 引用上一插件的 Result。</desc>
