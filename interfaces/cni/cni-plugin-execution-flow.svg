<title id="cnipluz-title">CNI 插件执行流程</title>
<desc id="cnipluz-desc">容器创建时，运行时调用 libcni 的 AddNetworkList，libcni 以 exec 执行网络插件的 ADD，插件委托 IPAM 插件分配 IP 后逐级返回结果；容器删除时按同样路径执行 DEL 与清理并逐级确认。</desc>
