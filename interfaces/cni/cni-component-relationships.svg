<desc id="cnicomz-desc">容器运行时调用 libcni（或直接实现 CNI 规范）；libcni 执行网络插件；网络插件基于插件骨架 pkg/skel 并遵循规范；libcni 与插件骨架都实现规范。规范、libcni 与骨架同属 CNI 仓库。</desc>
