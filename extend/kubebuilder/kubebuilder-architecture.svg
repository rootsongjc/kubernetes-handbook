<svg width="2400" height="940" viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kubebuz-title kubebuz-desc" id="kubebuilder-architecture-root" style="color-scheme: light dark"><style>svg{color-scheme:light dark}</style>
<title id="kubebuz-title">Kubebuilder 系统架构：从 CLI 到集群</title>
<desc id="kubebuz-desc">CLI 解析插件系统，插件调用脚手架引擎生成项目文件；项目文件导入 controller-runtime 等运行时依赖，并由 Makefile 调用 controller-gen 与 kustomize 构建出二进制与 CRD，最终部署到 Kubernetes 集群。</desc>
