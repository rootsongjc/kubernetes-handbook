<title id="projecz-title">Kubebuilder 项目初始化流程</title>
<desc id="projecz-desc">创建项目目录后执行 kubebuilder init（可配置 domain、repo、owner、description、license、skip-go-version-check 等参数），随后配置项目元数据、生成基础结构、创建 API 资源、实现控制器逻辑并测试部署。</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #project-init-flow-root { --color-paper:#ffffff; --color-ink:#1d1d1f; --color-muted:#6b7280; --font-sans:'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; --font-serif:'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #project-init-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #project-init-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#project-init-flow-root .diagram-container { overflow-x: visible; }
}</style>
