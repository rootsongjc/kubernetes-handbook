<title id="operatz-title">Operator SDK 总体架构</title>
<desc id="operatz-desc">项目工具与构建系统支撑 CLI 和插件系统；CLI 生成 Go、Ansible、Helm 三类 Operator，并产出 Bundle 与 Scorecard 测试；三类 Operator、Bundle 与 Scorecard 最终都交给 Operator Lifecycle Manager 管理。</desc>
