<title id="clipluz-title">Operator SDK CLI 插件系统</title>
<desc id="clipluz-desc">operator-sdk CLI 由插件系统与核心命令组成；插件系统按 Go、Ansible、Helm、Deploy Image 分为四个插件包，前三者各含 Kustomize、语言版本、Manifests、Scorecard 四个插件；核心命令覆盖 bundle、cleanup、generate、olm、run、scorecard、pkgmantobundle。</desc>
