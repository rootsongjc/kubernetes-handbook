<title id="migparz-title">MIG 分区资源暴露流程</title>
<desc id="migparz-desc">一块物理 GPU 被切分为 MIG-1（10GB）、MIG-2（10GB）与 MIG-3（20GB）三个分区，每个分区作为独立资源暴露到 Kubernetes 节点资源中。</desc>
