<svg width="2160" height="800" viewBox="0 0 1080 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="operatz-title operatz-desc" id="operator-sdk-dev-workflow-root" style="color-scheme: light dark"><style>svg{color-scheme:light dark}</style>
<title id="operatz-title">Operator SDK 开发流程</title>
<desc id="operatz-desc">八个步骤依次为项目初始化（operator-sdk init）、API 设计（operator-sdk create api）、控制器实现（Reconcile 逻辑、错误处理和重试）、RBAC 配置（最小权限）、测试编写（单元 + 集成，envtest）、构建打包（多架构镜像、安全扫描）、部署测试（kind / k3s 端到端验证）与发布到 OperatorHub（版本管理）。</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #operator-sdk-dev-workflow-root { --color-paper:#ffffff; --color-ink:#1d1d1f; --color-muted:#6b7280; --font-sans:'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; --font-serif:'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #operator-sdk-dev-workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #operator-sdk-dev-workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#operator-sdk-dev-workflow-root .diagram-container { overflow-x: visible; }
}</style>
