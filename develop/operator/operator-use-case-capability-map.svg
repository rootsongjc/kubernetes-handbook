<title id="operatz-title">Operator 应用场景与能力映射</title>
<desc id="operatz-desc">八类典型场景分别依赖四种 Operator 能力：自动化部署与服务发现依赖自定义资源定义；备份恢复、版本升级与主节点选举依赖智能控制器；故障注入依赖准入控制器；智能扩缩容与可观测性集成依赖指标收集。</desc>
