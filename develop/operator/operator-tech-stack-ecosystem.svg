<svg width="2320" height="1000" viewBox="0 0 1160 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="operatz-title operatz-desc" id="operator-tech-stack-ecosystem-root" style="color-scheme: light dark"><style>svg{color-scheme:light dark}</style>
<title id="operatz-title">Operator 技术栈生态</title>
<desc id="operatz-desc">Go 生态（Operator SDK、Kubebuilder、controller-runtime）、辅助工具（OLM、Helm Charts、cert-manager）、声明式工具（KUDO、Crossplane、Capsule）与多语言支持（Kopf、Fabric8、kube-rs）；Operator SDK 依赖 OLM 安装管理，Kubebuilder 构建在 controller-runtime 之上，KUDO 借助 Helm 打包分发，Crossplane 与 Capsule 同属平台抽象。</desc>
