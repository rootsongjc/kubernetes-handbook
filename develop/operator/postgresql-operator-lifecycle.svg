<?xml version="1.0" encoding="UTF-8"?>
<svg width="2320" height="960" viewBox="0 0 1160 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="postgrz-title postgrz-desc" id="postgresql-operator-lifecycle-root" style="color-scheme: light dark"><style>svg{color-scheme:light dark}</style>
<title id="postgrz-title">PostgreSQL Operator 生命周期流程</title>
<desc id="postgrz-desc">用户提交 CR 进入创建阶段（验证配置、预创建检查、资源调配、StatefulSet 部署、服务暴露、初始化配置），集群就绪后进入运维阶段（健康监控、自动备份、故障恢复）；版本升级请求触发升级阶段（滚动升级、数据迁移），删除请求触发清理阶段（最终备份、安全清理）后结束。</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #postgresql-operator-lifecycle-root { --color-paper:#ffffff; --color-ink:#1d1d1f; --color-muted:#6b7280; --font-sans:'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; --font-serif:'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #postgresql-operator-lifecycle-root { font-family: var(--font-sans); color: var(--color-ink); }
      #postgresql-operator-lifecycle-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#postgresql-operator-lifecycle-root .diagram-container { overflow-x: visible; }
}</style>
