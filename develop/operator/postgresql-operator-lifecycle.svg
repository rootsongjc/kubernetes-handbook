<text x="580" y="464" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">每个阶段方框内列出该阶段的状态与触发条件；运维阶段是常驻状态，升级与清理由外部请求触发。</text>
