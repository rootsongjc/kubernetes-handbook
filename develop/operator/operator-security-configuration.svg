<title id="operatz-title">Operator 安全配置体系</title>
<desc id="operatz-desc">安全性配置由四类措施支撑：身份认证（最小权限 RBAC、专用 ServiceAccount、短期令牌）、网络安全（NetworkPolicy、mTLS 加密、Ingress TLS）、运行时安全（Pod Security Standards、Secret 管理、镜像安全）与审计合规（审计日志、合规检查、取证能力）。</desc>
