<svg width="2160" height="1112" viewBox="0 0 1080 556" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clientz-title clientz-desc" id="client-go-informer-flow-root">
<title id="clientz-title">client-go Informer 工作流程</title>
<desc id="clientz-desc">Reflector 通过 List &amp; Watch 从 API Server 拉取对象写入 DeltaFIFO，Informer 弹出后交给 Indexer 存入线程安全缓存并分发事件；自定义控制器的事件处理函数把对象键入队，工作协程取键后再从 Indexer 读取对象处理。</desc>
