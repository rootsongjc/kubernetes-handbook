<title id="disastz-title">灾难恢复与备份架构</title>
<desc id="disastz-desc">Velero、Kasten K10、Portworx Backup 分别产出 etcd 备份、PVC 备份与配置备份；恢复时 etcd 还原集群、PVC 与配置还原应用，最后统一进行验证检查。</desc>
