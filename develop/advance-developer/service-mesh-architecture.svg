<title id="servicz-title">服务网格架构</title>
<desc id="servicz-desc">Istio 控制平面通过 Pilot 下发配置、Citadel 管理安全，驱动 Envoy 数据平面；微服务应用与 API Gateway 的流量经 Envoy 代理，并输出到监控系统。</desc>
