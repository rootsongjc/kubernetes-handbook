<title id="securiz-title">安全加固架构：身份认证、网络安全与运行时安全</title>
<desc id="securiz-desc">身份认证层由 OIDC、cert-manager、HashiCorp Vault 分别落地 RBAC、mTLS 与 Secret 管理；网络安全层由 Network Policies、Service Mesh、Ingress TLS 实现网络隔离与流量加密；运行时安全层由 Pod Security Standards、Falco、Kyverno 完成合规检查、安全监控与策略执行。</desc>
