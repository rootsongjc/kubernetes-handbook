<title id="communz-title">Kubernetes 社区沟通方式：同步、异步与协作工具</title>
<desc id="communz-desc">同步沟通包括定期会议、办公时间与贡献者峰会；异步沟通包括 Slack、Discord、GitHub Discussions 与邮件列表；协作工具包括 GitHub、Zulip 与社区日历。</desc>
