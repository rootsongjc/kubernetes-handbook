<title id="communz-title">Kubernetes 社区组织架构：四层治理</title>
<desc id="communz-desc">治理层（指导委员会、技术委员会）指导执行层的 SIG 与工作组；协调层的选举委员会产生指导委员会、社区联络委员会支撑贡献者峰会；支持层包含办公时间与 KubeCon。</desc>
