      #pod-requests-limits-rollup-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pod-requests-limits-rollup-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#pod-requests-limits-rollup-root .diagram-container { overflow-x: visible; }
}</style>

