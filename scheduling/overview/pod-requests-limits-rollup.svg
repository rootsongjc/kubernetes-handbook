<title id="podreqz-title">Pod 资源请求与限制：按容器求和</title>
<desc id="podreqz-desc">Pod 内两个容器各声明 requests（CPU 250m、Memory 64Mi）与 limits（CPU 500m、Memory 128Mi），Pod 级 requests 为 CPU 500m、Memory 128Mi，limits 为 CPU 1、Memory 256Mi。</desc>
