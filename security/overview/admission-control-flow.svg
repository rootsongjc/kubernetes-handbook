<title id="admissz-title">API 请求准入控制流程</title>
<desc id="admissz-desc">API 请求依次经过认证、鉴权、变更型准入、对象模式校验、校验型准入后持久化到 etcd；变更型与校验型阶段分别挂接各自的准入控制器。</desc>
