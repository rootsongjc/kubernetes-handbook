<title id="admissz-title">准入控制流程</title>
<desc id="admissz-desc">已鉴权请求先经过变更阶段（MutatingAdmissionWebhook 与其他变更型控制器），再经过校验阶段（ValidatingAdmissionWebhook、ValidatingAdmissionPolicy 与其他校验型控制器），全部通过后持久化对象；任一控制器拒绝即终止请求。</desc>
