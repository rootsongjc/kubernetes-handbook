      #admission-control-phases-root { font-family: var(--font-sans); color: var(--color-ink); }
      #admission-control-phases-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#admission-control-phases-root .diagram-container { overflow-x: visible; }
}</style>
