<title id="kustomz-title">Kustomize 资源处理架构：kyaml、api、kio 与转换器</title>
<desc id="kustomz-desc">RNode 是 kyaml 的核心节点结构，向上被 api 的 Resource / ResMap 包装并驱动各类转换器，向下由 kio 的 Readers / Pipeline / Writers 读写。</desc>
