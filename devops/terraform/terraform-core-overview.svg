<title id="terrafz-title">Terraform Core 简图：配置加载、依赖图、状态与 Provider</title>
<desc id="terrafz-desc">*.tf 文件由 configload.Loader 加载为 configs.Config，Graph Builder 构建依赖图，Graph Walker 以 EvalContext 遍历执行，同时读写 State Backend 并调用 Cloud / K8s / Helm Provider。</desc>
