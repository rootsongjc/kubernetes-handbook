<title id="reposiz-title">Repository Server 组件结构</title>
<desc id="reposiz-desc">argocd-repo-server 克隆 Git 仓库，使用 Helm、Kustomize、Jsonnet 与配置管理插件生成 Kubernetes manifests，维护仓库缓存并通过 Manifest API 对外提供。</desc>
