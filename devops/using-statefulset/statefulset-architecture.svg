<title id="statefz-title">StatefulSet 与相关组件</title>
<desc id="statefz-desc">Headless Service 为 StatefulSet 提供稳定 DNS；StatefulSet 通过 volumeClaimTemplates 为每个 Pod 创建独立 PVC，由拓扑感知的 StorageClass 绑定；探针、亲和性、PDB 保障可用性；可选 Operator 与 Prometheus 监控协同。</desc>
