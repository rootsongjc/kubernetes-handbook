<title id="hcmreqz-title">HTTP 过滤器在请求与响应路径上的调用顺序</title>
<desc id="hcmreqz-desc">过滤器链按声明顺序排列；请求路径只调用解码器与解码/编码器类型的过滤器，响应路径按相反方向只调用编码器与解码/编码器类型的过滤器。</desc>
