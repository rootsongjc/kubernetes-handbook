<?xml version="1.0" encoding="UTF-8"?>
<svg width="1800" height="840" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="envoyhz-title envoyhz-desc" id="envoy-hcm-filter-root">
<title id="envoyhz-title">HCM 过滤器内部的 HTTP 过滤器链</title>
<desc id="envoyhz-desc">网络过滤器链中的 HTTP 连接管理器（HCM）把字节流解析为 HTTP 消息，并在内部运行一条 HTTP 过滤器链，最后一个过滤器必须是执行路由的 router。</desc>
