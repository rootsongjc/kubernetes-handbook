<text x="450" y="404" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">HTTP 过滤器在 http_filters 下声明，处理访问日志、请求 ID、头部操作与路由表；router 必须排在最后。</text>
