<title id="envoyfz-title">监听器按匹配条件选择过滤器链</title>
<desc id="envoyfz-desc">监听器收到连接后，根据 filter_chain_match 中的目标端口、SNI、源地址等属性选择一条过滤器链，连接随后依次流经该链中的网络过滤器。</desc>
