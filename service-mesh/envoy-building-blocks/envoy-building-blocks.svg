<title id="envoybz-title">请求在 Envoy 构建块中的流转</title>
<desc id="envoybz-desc">请求依次经过监听器、路由、集群和端点四个构建块：监听器接收连接，路由按元数据匹配并选择集群，集群维护上游端点与负载均衡策略，端点是具体的上游地址。</desc>
