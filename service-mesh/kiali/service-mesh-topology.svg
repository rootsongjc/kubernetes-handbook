<title id="servicz-title">服务网格拓扑图示例：从入口网关到数据层</title>
<desc id="servicz-desc">Istio Gateway 接入流量后进入服务 A，服务 A 分别调用服务 B 与服务 C，两者汇聚到服务 D，服务 D 访问数据库与缓存。</desc>
