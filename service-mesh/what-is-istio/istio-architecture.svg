<svg width="2000" height="1132" viewBox="0 0 1000 566" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="istioaz-title istioaz-desc" id="istio-architecture-root">
<title id="istioaz-title">Istio 架构：数据平面与控制平面</title>
<desc id="istioaz-desc">数据平面由每个 Pod 内与服务并列的 Envoy 代理组成，处理入口、网格内与出口流量；控制平面 istiod 统一向代理下发服务发现、配置与证书。</desc>
