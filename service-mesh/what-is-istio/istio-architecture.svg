      #istio-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #istio-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#istio-architecture-root .diagram-container { overflow-x: visible; }
}</style>
