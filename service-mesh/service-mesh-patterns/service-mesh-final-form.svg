      #service-mesh-final-form-root { font-family: var(--font-sans); color: var(--color-ink); }
      #service-mesh-final-form-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#service-mesh-final-form-root .diagram-container { overflow-x: visible; }
}</style>
