<svg width="1800" height="1096" viewBox="0 0 900 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="meshpaz-title meshpaz-desc" id="mesh-pattern-control-plane-root">
<title id="meshpaz-title">完整服务网格：Sidecar 代理 + 控制平面</title>
<desc id="meshpaz-desc">数据平面由每个 Pod 内的 Sidecar 代理组成，负责 Ingress、服务间与 Egress 流量；控制平面统一下发配置、服务发现与证书，Istio、Linkerd、Consul Connect 均采用此架构。</desc>
