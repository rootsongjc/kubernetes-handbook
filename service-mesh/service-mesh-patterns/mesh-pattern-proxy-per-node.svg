<svg width="1800" height="784" viewBox="0 0 900 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="meshpaz-title meshpaz-desc" id="mesh-pattern-proxy-per-node-root">
<title id="meshpaz-title">节点代理模式（Proxy per Node）</title>
<desc id="meshpaz-desc">每个节点运行一个代理实例（Kubernetes 中通常为 DaemonSet），本节点的所有服务实例共用这个代理与其他节点通信，Linkerd 1.x 曾采用此方式。</desc>
