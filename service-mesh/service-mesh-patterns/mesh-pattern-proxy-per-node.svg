      #mesh-pattern-proxy-per-node-root { font-family: var(--font-sans); color: var(--color-ink); }
      #mesh-pattern-proxy-per-node-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#mesh-pattern-proxy-per-node-root .diagram-container { overflow-x: visible; }
}</style>
