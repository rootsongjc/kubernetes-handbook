<title id="cnipluz-title">CNI 插件分类：网络模型与主流实现</title>
<desc id="cnipluz-desc">Overlay 网络对应 Flannel、Weave；路由网络对应 Calico、Cilium；Underlay 网络对应 AWS VPC CNI、Azure CNI、GKE 网络；Canal 组合了 Flannel 与 Calico。</desc>
