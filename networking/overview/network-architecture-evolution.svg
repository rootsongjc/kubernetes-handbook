<title id="networz-title">网络架构演进：从单体到微服务</title>
<desc id="networz-desc">单体应用只有客户端、负载均衡器、单体进程与数据库一条链路；微服务架构中 Ingress 接入 API 服务，再分发到用户、订单、支付服务及各自数据库，服务发现、负载均衡、网络隔离与流量控制的复杂度随之递增。</desc>
