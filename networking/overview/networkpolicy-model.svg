<title id="networz-title">NetworkPolicy 模型结构</title>
<desc id="networz-desc">入口与出口规则通过 Pod 选择器、命名空间选择器、IP 地址块、端口和协议四类条件匹配流量；匹配到的流量被允许，未匹配的流量按默认行为拒绝。</desc>
