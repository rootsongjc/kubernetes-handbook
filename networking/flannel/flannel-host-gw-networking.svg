<svg width="2160" height="1344" viewBox="0 0 1080 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flannez-title flannez-desc" id="flannel-host-gw-networking-root">
<title id="flannez-title">Flannel host-gw 后端的跨节点 Pod 网络</title>
<desc id="flannez-desc">每个节点有独立的 Pod 子网；flanneld 从子网管理器读取各节点子网并写入本机路由表，Pod 流量经 cni0 网桥、路由表和 eth0 直接路由到对端节点，无需封装。</desc>
