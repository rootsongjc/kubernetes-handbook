<title id="ipmasqz-title">ip-masq-agent 的工作原理</title>
<desc id="ipmasqz-desc">节点上的 Pod 经 cbr0 网桥和 eth0 对外通信：目标在集群 CIDR 内的流量保持 Pod 源地址不变；目标在集群外的流量被 SNAT 为节点 eth0 的地址。</desc>
