<svg width="1880" height="1160" viewBox="0 0 940 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="podlifz-title podlifz-desc" id="pod-lifecycle-states-root" style="color-scheme: light dark"><style>svg{color-scheme:light dark}</style>
<title id="podlifz-title">Pod 生命周期状态图</title>
<desc id="podlifz-desc">Pod 从 Pending 开始；调度并启动容器后进入 Running；全部容器正常终止为 Succeeded，至少一个容器失败为 Failed，节点通信异常为 Unknown；启动失败则从 Pending 直接进入 Failed。</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #pod-lifecycle-states-root { --color-paper:#ffffff; --color-ink:#1d1d1f; --color-muted:#6b7280; --font-sans:'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; --font-serif:'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #pod-lifecycle-states-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pod-lifecycle-states-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#pod-lifecycle-states-root .diagram-container { overflow-x: visible; }
}</style>
