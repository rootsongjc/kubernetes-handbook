<title id="authorz-title">多鉴权器判定流程</title>
<desc id="authorz-desc">已认证请求依次交给配置的鉴权器判定：任一鉴权器明确允许即放行，明确拒绝即返回 403 Forbidden；返回无意见则交给下一个鉴权器，全部无意见时默认拒绝。</desc>
