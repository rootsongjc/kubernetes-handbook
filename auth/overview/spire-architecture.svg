<title id="spireaz-title">SPIRE 架构：节点证明、工作负载证明与 SVID 发放</title>
<desc id="spireaz-desc">SPIRE Server 通过 Node Attestor 验证节点身份、通过 Workload Attestor 验证工作负载身份，验证通过后发放 SVID，工作负载使用 SVID 进行服务间 mTLS 通信。</desc>
