<title id="resourz-title">资源同步流程：云到边下发与边到云状态上报</title>
<desc id="resourz-desc">Kubernetes API 的资源变更经 EdgeController、CloudHub/EdgeHub、MetaManager 下发到 Edged 执行容器操作；状态沿原路上报，由 UpstreamController 更新 API Server。</desc>
