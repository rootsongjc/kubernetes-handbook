<title id="edgecoz-title">EdgeCore 内部模块：边缘主代理集成六个模块</title>
<desc id="edgecoz-desc">EdgeCore 作为边缘主代理集成 Edged（轻量 Kubelet）、EdgeHub（云连接）、MetaManager（元数据存储）、DeviceTwin（设备状态同步）、EventBus（MQTT 客户端）、ServiceBus（HTTP 客户端）。</desc>
