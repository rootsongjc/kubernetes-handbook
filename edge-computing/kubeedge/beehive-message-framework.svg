<title id="beehivz-title">KubeEdge 消息框架：所有模块经 Beehive 收发消息</title>
<desc id="beehivz-desc">云端模块（EdgeController、DeviceController、SyncController）与边缘模块（MetaManager、DeviceTwin、Edged）都接入 Beehive 消息系统；CloudHub 与 EdgeHub 之间通过 WebSocket/QUIC 承载云边消息。</desc>
