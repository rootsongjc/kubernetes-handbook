      #beehive-message-framework-root { font-family: var(--font-sans); color: var(--color-ink); }
      #beehive-message-framework-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#beehive-message-framework-root .diagram-container { overflow-x: visible; }
}</style>
