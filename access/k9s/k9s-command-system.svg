<title id="k9scomz-title">k9s 命令系统：从输入到执行</title>
<desc id="k9scomz-desc">用户输入进入命令缓冲区，由命令解释器解析为命令对象；命令对象执行应用动作，或按资源、上下文、命名空间、特殊命令分派到对应执行逻辑。</desc>
