<title id="k9sconz-title">k9s 配置与定制：配置文件如何进入 App、命令与 UI</title>
<desc id="k9sconz-desc">用户编辑配置文件：k9s.yaml 全局配置与 context_{name}.yaml 上下文配置在启动或切换上下文时加载进 App，aliases.yaml 驱动命令解析，hotkeys.yaml 与皮肤文件作用于 UI；Config Watcher 监听文件变化并热重载。</desc>
