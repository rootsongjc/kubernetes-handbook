<title id="k9sresz-title">k9s 资源视图类图</title>
<desc id="k9sresz-desc">ResourceViewer 接口定义 Init、App、Start、Stop、GetTable；Browser 与 LogViewer 实现该接口，Browser 组合一个 Table 组件展示表格数据。</desc>
