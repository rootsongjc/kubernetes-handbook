<title id="podrunz-title">调试 Pod（二）：Pod 正在运行但工作异常</title>
<desc id="podrunz-desc">Pod 已 Running 时的排查路径：依次检查应用日志、Service 与 Ingress 配置、网络策略、网络追踪与外部依赖；每一步发现问题即处置，否则继续下一项，全部排除后查看系统日志或寻求外部支持。</desc>
