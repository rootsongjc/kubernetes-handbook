<title id="persisz-title">持久存储生命周期</title>
<desc id="persisz-desc">供应创建 PV，绑定将 PVC 与 PV 配对，使用阶段 Pod 挂载卷并受存储对象保护；Pod 释放卷后进入释放，PVC 删除后按回收策略回收，最终保留、删除或回收（Recycle 已废弃）。</desc>
