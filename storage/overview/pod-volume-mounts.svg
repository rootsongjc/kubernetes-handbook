<title id="podvolz-title">Pod 与卷的挂载关系</title>
<desc id="podvolz-desc">同一 Pod 内的两个容器通过各自的 volumeMounts 挂载卷：容器 1 与容器 2 共享卷 1，容器 2 还单独挂载卷 2。</desc>
