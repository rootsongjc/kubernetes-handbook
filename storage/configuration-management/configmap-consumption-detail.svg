<title id="configz-title">ConfigMap 的三种消费方式</title>
<desc id="configz-desc">ConfigMap 中的单个键可通过 configMapKeyRef 注入为环境变量并在命令参数中以 $(KEY1) 引用；完整配置文件则通过 configMap 卷挂载为容器内文件。</desc>
