<title id="configz-title">ConfigMap / Secret 生命周期</title>
<desc id="configz-desc">资源由 kubectl create/apply 创建后被 Pod 消费；kubectl apply/edit 更新后进入变更传播：卷挂载最终一致，环境变量需重启 Pod，随后回到被消费状态；kubectl delete 结束生命周期。</desc>
