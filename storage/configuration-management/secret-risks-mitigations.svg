<title id="secretz-title">Secret 默认安全风险与缓解措施</title>
<desc id="secretz-desc">etcd 未加密存储通过启用静态加密或外部密文管理缓解；API Server 可访问通过最小权限 RBAC 或外部密文管理缓解；RBAC 权限过宽通过最小权限 RBAC 缓解；Pod 级别访问通过限制容器访问缓解；不可变 Secret 作为通用加固措施。</desc>
