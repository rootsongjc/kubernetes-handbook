      #configmap-vs-secret-decision-root { font-family: var(--font-sans); color: var(--color-ink); }
      #configmap-vs-secret-decision-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#configmap-vs-secret-decision-root .diagram-container { overflow-x: visible; }
}</style>
