<title id="configz-title">ConfigMap 与 Secret 选择流程</title>
<desc id="configz-desc">先按数据是否敏感选择 Secret 或 ConfigMap；再按访问方式选卷挂载、环境变量或命令参数；数据大于 1MiB 时改用外部卷或拆分资源，否则在 Pod 规范中实现；最后按是否频繁变更选择可变或不可变资源。</desc>
