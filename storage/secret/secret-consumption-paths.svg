<title id="secretz-title">Secret 的使用流程</title>
<desc id="secretz-desc">创建 Secret 后，可通过 Volume 挂载成为容器内文件、通过环境变量注入容器，或作为 imagePullSecret 用于拉取镜像；三种方式最终都由 Pod 在运行时访问 Secret。</desc>
