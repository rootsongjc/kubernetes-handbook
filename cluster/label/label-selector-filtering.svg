<title id="labelsz-title">Label Selector 选择关系：逐级过滤出目标对象</title>
<desc id="labelsz-desc">从所有 Pod 出发，等值选择器 environment=production 与 tier=frontend 逐级过滤得到目标 Pod 集合；不等选择器 environment!=development 则选出非开发环境的 Pod。</desc>
