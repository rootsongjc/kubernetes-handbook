      #service-selects-pods-by-label-root { font-family: var(--font-sans); color: var(--color-ink); }
      #service-selects-pods-by-label-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#service-selects-pods-by-label-root .diagram-container { overflow-x: visible; }
}</style>
