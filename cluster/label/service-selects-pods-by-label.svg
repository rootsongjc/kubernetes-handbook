<svg width="2000" height="1000" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="servicz-title servicz-desc" id="service-selects-pods-by-label-root">
<title id="servicz-title">Service 通过 Label 跨节点选中 Pod</title>
<desc id="servicz-desc">两个 Service 各自通过 selector 匹配 Pod 的 labels：app=web 的 Pod 分布在两个节点上被 Service web 选中，app=api 的 Pod 被 Service api 选中，app=cache 的 Pod 不属于任何 Service。</desc>
