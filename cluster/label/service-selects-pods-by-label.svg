<text x="500" y="484" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Service 只看 labels 是否与 selector 匹配，与 Pod 落在哪个节点无关；未被任何 selector 匹配的 Pod 不会收到 Service 流量。</text>
