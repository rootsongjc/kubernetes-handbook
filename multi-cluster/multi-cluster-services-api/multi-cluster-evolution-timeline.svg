<?xml version="1.0" encoding="UTF-8"?>
<svg width="2160" height="760" viewBox="0 0 1080 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="multicz-title multicz-desc" id="multi-cluster-evolution-timeline-root" style="color-scheme: light dark"><style>svg{color-scheme:light dark}</style>
<title id="multicz-title">Kubernetes 多集群管理的演进（2016–2025）</title>
<desc id="multicz-desc">从 2016 年 Federation v1、2018 年 KubeFed，到 2020–2021 年 MCS API 与 ServiceExport/ServiceImport，再到 2022–2024 年 Karmada、OCM、Fleet 等控制平面兴起，以及 2024–2025 年 Multi-Cluster Gateway API 成为官方推荐方向。</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #multi-cluster-evolution-timeline-root { --color-paper:#ffffff; --color-ink:#1d1d1f; --color-muted:#6b7280; --font-sans:'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; --font-serif:'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #multi-cluster-evolution-timeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #multi-cluster-evolution-timeline-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#multi-cluster-evolution-timeline-root .diagram-container { overflow-x: visible; }
}</style>

