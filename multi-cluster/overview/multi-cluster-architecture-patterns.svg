      #multi-cluster-architecture-patterns-root { font-family: var(--font-sans); color: var(--color-ink); }
      #multi-cluster-architecture-patterns-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#multi-cluster-architecture-patterns-root .diagram-container { overflow-x: visible; }
}</style>
