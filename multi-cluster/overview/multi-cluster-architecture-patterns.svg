<?xml version="1.0" encoding="UTF-8"?>
<svg width="2200" height="1280" viewBox="0 0 1100 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="multicz-title multicz-desc" id="multi-cluster-architecture-patterns-root" style="color-scheme: light dark"><style>svg{color-scheme:light dark}</style>
<title id="multicz-title">四种典型的多集群架构模式</title>
<desc id="multicz-desc">独立集群模式下各集群互不关联；主控集群模式由 Hub 统一管理多个 Spoke；联邦模式通过统一 API 与策略同步把多个集群组成逻辑整体；混合模式由中心云集群管理边缘集群，边缘集群之间可松耦合协同。</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
