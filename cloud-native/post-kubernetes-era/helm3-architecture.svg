<title id="helm3az-title">Helm 3 架构</title>
<desc id="helm3az-desc">Helm 客户端从 Chart 仓库拉取 Chart，用 values 渲染为 Kubernetes 清单后直接提交给 API Server；Release 状态以 Secret 形式保存在集群内，不再需要 Tiller。</desc>
