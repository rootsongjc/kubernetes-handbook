<text x="98.4615" y="244" style="fill:#1d1d1f" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Kubernetes 开源</text>
<circle cx="175.385" cy="296" r="3.5" style="fill:#6b7280"/>
<text x="175.385" y="314" style="fill:#1d1d1f" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Kubernetes 1.0 发布</text>
<text x="175.385" y="330" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">CNCF 成立</text>
<circle cx="252.308" cy="226" r="3.5" style="fill:#6b7280"/>
<text x="252.308" y="244" style="fill:#1d1d1f" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">CRD / Operator 模式确立</text>
<circle cx="329.231" cy="296" r="3.5" style="fill:#6b7280"/>
<text x="329.231" y="314" style="fill:#1d1d1f" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Istio 开源</text>
<text x="329.231" y="330" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">击败 Swarm 与 Mesos</text>
<circle cx="406.154" cy="226" r="3.5" style="fill:#6b7280"/>
<text x="406.154" y="244" style="fill:#1d1d1f" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Knative 开源</text>
<text x="406.154" y="260" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Kubernetes 从 CNCF 毕业</text>
<circle cx="483.077" cy="296" r="3.5" style="fill:#6b7280"/>
<text x="483.077" y="314" style="fill:#1d1d1f" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">OAM 开源</text>
<circle cx="636.923" cy="226" r="3.5" style="fill:#6b7280"/>
<text x="636.923" y="244" style="fill:#1d1d1f" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">GitOps 成为交付主流</text>
<text x="636.923" y="260" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">平台工程兴起</text>
<circle cx="867.692" cy="296" r="3.5" style="fill:#0a84ff"/>
<text x="867.692" y="314" style="fill:#1d1d1f" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Gateway API Inference Extension</text>
<circle cx="944.615" cy="226" r="3.5" style="fill:#0a84ff"/>
<text x="944.615" y="244" style="fill:#1d1d1f" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">DRA GA（v1.34）</text>
<text x="944.615" y="260" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">AI Conformance 认证</text>
<text x="560" y="412" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Kubernetes 从容器编排器演进为异构算力与策略的声明式控制面，生态重心随之从基础设施转向应用层。</text>
<text x="560" y="44" style="fill:#1d1d1f" font-size="22" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">云原生的发展阶段（2014 年至今）</text>
<text x="98.4615" y="175" style="fill:#ffffff" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">2014</text>
<text x="213.846" y="175" style="fill:#ffffff" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">2015 – 2016</text>
<text x="367.692" y="175" style="fill:#ffffff" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">2017 – 2018</text>
<text x="636.923" y="175" style="fill:#ffffff" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">2019 – 2023</text>
<text x="944.615" y="175" style="fill:#ffffff" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">2024 年至今</text>
