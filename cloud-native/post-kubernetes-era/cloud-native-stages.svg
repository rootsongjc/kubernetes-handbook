<title id="cloudnz-title">云原生的发展阶段（2014 年至今）</title>
<desc id="cloudnz-desc">时间轴分为孵化期、高速发展期、野蛮生长期、成熟普及期和 AI 原生期五个阶段，下方标出 Kubernetes 开源、CNCF 成立、CRD/Operator、Istio、Knative、OAM、GitOps、DRA 等关键事件。</desc>
