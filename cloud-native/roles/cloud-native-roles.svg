<?xml version="1.0" encoding="UTF-8"?>
<svg width="2000" height="1080" viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cloudnz-title cloudnz-desc" id="cloud-native-roles-root">
<title id="cloudnz-title">云原生应用中的三种角色</title>
<desc id="cloudnz-desc">应用开发者负责代码、需要掌握业务逻辑，平台工程师负责应用平台、需要掌握领域知识，基础设施运维负责计算、存储与网络、需要掌握底层系统；相邻角色在自助服务与资源抽象上交叠。</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #cloud-native-roles-root { --color-paper:#ffffff; --color-ink:#1d1d1f; --color-muted:#6b7280; --font-sans:'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; --font-serif:'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #cloud-native-roles-root { font-family: var(--font-sans); color: var(--color-ink); }
      #cloud-native-roles-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#cloud-native-roles-root .diagram-container { overflow-x: visible; }
}</style>

