<title id="oamtarz-title">云原生应用模型中的目标角色</title>
<desc id="oamtarz-desc">基础设施运维提供 Workload 类型，应用运维定义 Trait 与 ApplicationScope，应用开发者定义 Component，开发者与运维共同在 ApplicationConfiguration 中组装并维护应用生命周期。</desc>
