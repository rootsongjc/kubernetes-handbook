<title id="knativz-title">Knative Eventing 事件流</title>
<desc id="knativz-desc">HTTP、Kafka、Git、定时器与 CloudEvents 等事件源进入事件入口，交给 Broker，由 Trigger 过滤后投递给订阅者；投递失败时触发重试机制。</desc>
