<title id="knativz-title">Knative Serving 请求处理流程</title>
<desc id="knativz-desc">请求经 Ingress 到 Activator；实例数为 0 时由 Activator 激活实例、启动 Pod 并初始化容器，随后经 Queue Proxy 转发给用户容器处理，响应原路返回客户端。</desc>
