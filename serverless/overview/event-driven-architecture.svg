<title id="eventdz-title">事件驱动架构：事件源、事件处理与函数执行</title>
<desc id="eventdz-desc">六类事件源汇入事件摄入，依次经过过滤、转换、路由、投递，再交给触发器、执行器并产出执行结果。</desc>
