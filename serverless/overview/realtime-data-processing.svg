<title id="realtiz-title">实时数据处理的 Serverless 架构</title>
<desc id="realtiz-desc">IoT 设备、移动应用、Web 应用的数据汇入摄入函数，经验证、处理、存储函数写入时序数据库、对象存储和搜索引擎；处理函数产出吞吐量与延迟指标，存储函数产出错误率与处理成本指标。</desc>
