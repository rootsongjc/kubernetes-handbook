<title id="microsz-title">微服务架构与 Serverless 架构对比</title>
<desc id="microsz-desc">左侧微服务：API 网关到持续运行的服务 A、B、C 再到数据库与缓存；右侧 Serverless：事件总线到按需启动的函数 1、2、3 再到对象存储与 Serverless 数据库；中间列出四项关键区别及其对应的组件。</desc>
