      #pub-sub-pattern-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pub-sub-pattern-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#pub-sub-pattern-root .diagram-container { overflow-x: visible; }
}</style>
