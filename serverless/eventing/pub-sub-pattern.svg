<title id="pubsubz-title">发布 - 订阅模式</title>
<desc id="pubsubz-desc">订单服务把事件发布到 Broker，Broker 按各订阅者注册的 Trigger 把事件分发给邮件、库存、计费和分析服务。</desc>
