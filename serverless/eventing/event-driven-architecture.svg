<title id="eventdz-title">Knative Eventing 事件驱动架构</title>
<desc id="eventdz-desc">多种事件生产者产生事件，经事件源进入 Broker，依次过滤、转换后通过 Channel 投递给 Serverless 函数、微服务、批处理作业或外部系统。</desc>
