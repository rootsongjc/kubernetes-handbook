<title id="releasz-title">Kubernetes 版本发布与支持周期</title>
<desc id="releasz-desc">小版本经 Alpha、Beta、RC 到 GA 约 3–4 个月；GA 后进入 12 个月标准支持与 2 个月维护模式，期间每月发布补丁，然后生命周期结束。</desc>
