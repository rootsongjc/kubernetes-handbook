<title id="kubeadz-title">kubeadm init 工作流</title>
<desc id="kubeadz-desc">预检 → 生成证书 → 生成 kubeconfig → 生成控制面组件静态 Pod 清单 → RBAC 配置 → 生成引导令牌 → 安装 CoreDNS 与 kube-proxy。</desc>
