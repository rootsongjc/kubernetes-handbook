      #hpa-workflow-root { --color-paper:#ffffff; --color-ink:#1d1d1f; --color-muted:#6b7280; --font-sans:'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; --font-serif:'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #hpa-workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #hpa-workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#hpa-workflow-root .diagram-container { overflow-x: visible; }
}</style>
