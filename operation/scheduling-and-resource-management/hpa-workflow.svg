<title id="hpaworz-title">HPA 工作流程</title>
<desc id="hpaworz-desc">HPA 控制器的指标采集器从 Metrics Server 的 metrics.k8s.io API 拉取 Pod CPU / 内存指标，交给扩缩计算器算出期望副本数，再调整 Deployment 的 ReplicaSet，由其管理 Pod 1 到 Pod 3。</desc>
