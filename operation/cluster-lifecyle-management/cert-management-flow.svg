<text x="500" y="392" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">kubeadm upgrade 升级控制平面时会自动续期全部证书；手动续期后需重启控制面 Pod 生效。</text>
