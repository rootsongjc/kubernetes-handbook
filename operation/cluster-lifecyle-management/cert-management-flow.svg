      #cert-management-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #cert-management-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#cert-management-flow-root .diagram-container { overflow-x: visible; }
}</style>
