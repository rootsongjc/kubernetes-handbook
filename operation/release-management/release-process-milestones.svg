<title id="releasz-title">发布流程与关键里程碑</title>
<desc id="releasz-desc">一个约 14 周的发布周期分为功能定义、实现、稳定三个阶段，分别对应功能冻结（第 4 周）、代码冻结（第 12–14 周）与正式发布（第 14 周）三个里程碑。</desc>
