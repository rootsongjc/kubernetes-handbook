<title id="releasz-title">Kubernetes 版本发布与支持周期</title>
<desc id="releasz-desc">小版本周期（3–4 个月）依次经过 Alpha、Beta、RC 到 GA；GA 后进入 12 个月标准支持和 2 个月维护模式直至 EOL；每月补丁持续注入标准支持与维护模式两个阶段。</desc>
