      #pod-container-patterns-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pod-container-patterns-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#pod-container-patterns-root .diagram-container { overflow-x: visible; }
}</style>
