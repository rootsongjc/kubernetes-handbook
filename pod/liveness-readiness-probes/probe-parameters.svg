<path d="M 416 162 L 452 162" fill="none" style="stroke:#6b7280" stroke-width="1.7" marker-end="url(#probe-parameters-m-6b7280)"/>
<path d="M 628 162 L 664 162" fill="none" style="stroke:#6b7280" stroke-width="1.7" marker-end="url(#probe-parameters-m-6b7280)"/>
<path d="M 840 162 L 876 162" fill="none" style="stroke:#6b7280" stroke-width="1.7" marker-end="url(#probe-parameters-m-6b7280)"/>
