<?xml version="1.0" encoding="UTF-8"?>
<svg width="2160" height="600" viewBox="0 0 1080 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="probepz-title probepz-desc" id="probe-parameters-root" style="color-scheme: light dark"><style>svg{color-scheme:light dark}</style>
<title id="probepz-title">探针参数关系</title>
<desc id="probepz-desc">五个通用参数按生效顺序排列：initialDelaySeconds 决定首次探测时间，periodSeconds 决定频率，timeoutSeconds 限制单次耗时，successThreshold 与 failureThreshold 决定判定阈值。</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #probe-parameters-root { --color-paper:#ffffff; --color-ink:#1d1d1f; --color-muted:#6b7280; --font-sans:'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; --font-serif:'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #probe-parameters-root { font-family: var(--font-sans); color: var(--color-ink); }
      #probe-parameters-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#probe-parameters-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="probe-parameters-m-6b7280" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" style="fill:#6b7280"/></marker>
</defs>
<rect width="100%" height="100%" style="fill:#ffffff"/>
<g font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
