<title id="probedz-title">Kubernetes 探针生命周期流程</title>
<desc id="probedz-desc">Pod 启动后先由 Liveness 探针判定：失败则重启容器；成功后由 Readiness 探针判定：失败则从 Service 负载均衡移除，成功则正常对外服务。</desc>
