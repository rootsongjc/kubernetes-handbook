      #probe-decision-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #probe-decision-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#probe-decision-flow-root .diagram-container { overflow-x: visible; }
}</style>
