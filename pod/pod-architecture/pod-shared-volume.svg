<?xml version="1.0" encoding="UTF-8"?>
<svg width="1800" height="980" viewBox="0 0 900 490" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="podshaz-title podshaz-desc" id="pod-shared-volume-root">
<title id="podshaz-title">多容器 Pod 通过共享卷协作</title>
<desc id="podshaz-desc">内容管理器把内容交给 File Puller 容器写入共享卷，Web Server 容器从同一卷读取后对外提供服务；两个容器同属一个 Pod。</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #pod-shared-volume-root { --color-paper:#ffffff; --color-ink:#1d1d1f; --color-muted:#6b7280; --font-sans:'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; --font-serif:'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #pod-shared-volume-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pod-shared-volume-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#pod-shared-volume-root .diagram-container { overflow-x: visible; }
}</style>
