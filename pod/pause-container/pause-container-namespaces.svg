<?xml version="1.0" encoding="UTF-8"?>
<svg width="1800" height="1056" viewBox="0 0 900 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pausecz-title pausecz-desc" id="pause-container-namespaces-root">
<title id="pausecz-title">Pause 容器持有 Pod 的命名空间</title>
<desc id="pausecz-desc">pause 容器先创建 IPC、Network、PID 与 UTS 命名空间，nginx 与 ghost 容器随后加入，因而共享同一 IP、可通过 localhost 互访，用户访问 nginx 暴露的端口。</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #pause-container-namespaces-root { --color-paper:#ffffff; --color-ink:#1d1d1f; --color-muted:#6b7280; --font-sans:'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; --font-serif:'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
      #pause-container-namespaces-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pause-container-namespaces-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#pause-container-namespaces-root .diagram-container { overflow-x: visible; }
}</style>
