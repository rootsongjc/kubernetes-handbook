<text x="450" y="512" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">pause 先启动并持有命名空间，业务容器以 --net/--ipc/--pid=container:pause 加入；业务容器重启不会丢失 Pod IP。</text>
