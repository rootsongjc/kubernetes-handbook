<marker id="pause-container-namespaces-m-start-6b7280" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="9 0, 0 3.5, 9 7" style="fill:#6b7280"/></marker>
</defs>
