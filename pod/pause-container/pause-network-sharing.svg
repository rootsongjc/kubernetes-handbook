<text x="993.5" y="174.875" style="fill:#6b7280" font-size="11" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">同一 IP、端口空间</text>
<text x="540" y="252" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">Pause 容器只负责持有命名空间：业务容器重启不会丢失 Pod IP。</text>
