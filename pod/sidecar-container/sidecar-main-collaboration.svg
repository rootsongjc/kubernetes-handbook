<title id="sidecaz-title">Sidecar 容器与主容器协作关系</title>
<desc id="sidecaz-desc">同一 Pod 内的主容器与 Sidecar 容器通过共享存储卷和网络命名空间协作，Sidecar 承担日志收集、代理等辅助功能。</desc>
