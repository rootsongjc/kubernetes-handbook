<text x="692.5" y="207.25" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">日志收集 / 代理 / 监控</text>
<text x="692.5" y="224.65" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">可独立更新与复用</text>
<text x="450" y="290" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">共享网络命名空间（localhost 互通）、存储卷与生命周期</text>
<text x="450" y="310" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">两者一同调度、启动与终止</text>
<text x="450" y="360" style="fill:#6b7280" font-size="12" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">主容器与 Sidecar 松耦合：功能独立、对主应用透明、可跨应用复用。</text>
